[package]
name = "lanlink"
version = "0.1.0"
edition = "2021"
description = "LAN-only remote desktop for Windows"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
arboard = { version = "3.4", features = ["image-data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
if-addrs = "0.13"
hostname = "0.4"
rfd = "0.15"
chrono = "0.4"
dirs = "6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
